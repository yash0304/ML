# Builds an installable SafarSathi APK.
#
# The build container this project is developed in cannot reach
# dl.google.com, so it has no Android SDK and cannot produce an APK. GitHub's
# runners already have one, which makes this the shortest path from a commit
# to something you can put on a phone.
#
# SIGNING. If the ANDROID_KEYSTORE_BASE64 secret is set, the APK is signed
# with that key every time, so each new build installs over the last one and
# the database survives. Without it the build falls back to debug keys, which
# a CI runner regenerates at random on every run — and Android then refuses
# the upgrade, so the only way to install is to uninstall first and lose
# everything in the app. The step below says which happened.

name: SafarSathi APK

on:
  push:
    branches:
      - claude/offline-retro-modern-app-design-r2n4ju
    paths:
      - 'safarsathi/**'
      - '.github/workflows/safarsathi-apk.yml'
  workflow_dispatch:

# The release step below writes to the repository.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safarsathi

    steps:
      - uses: actions/checkout@v4

      # AGP 9 and Gradle 9 want a recent JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Toolchain
        run: flutter doctor -v

      - run: flutter pub get

      # The same gates the project holds itself to. A build that ships a
      # broken diary is worse than no build.
      - run: flutter analyze
      - run: flutter test

      # THE KEY COMES FROM A SECRET, NEVER FROM A TRACKED FILE.
      #
      # Set MAPTILER_KEY under Settings → Secrets and variables → Actions.
      # Without it the build still succeeds: the map disables itself and says
      # so on screen, which is the designed behaviour rather than a failure.
      #
      # `--dart-define` bakes the value into the binary, as every mobile map
      # SDK does. That is not a secret from whoever holds the APK; what it
      # avoids is the key living in git history forever. Restricting the key
      # to this app's package name in the MapTiler dashboard is the control
      # that actually matters.
      # THE KEYSTORE COMES FROM A SECRET, NEVER FROM A TRACKED FILE.
      #
      # Four secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. RUNNING.md has the keytool
      # command that produces them.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Guarded in the shell rather than with a step-level `if`: the
          # secrets context is not dependably available to `if` expressions,
          # and a silently-skipped signing step is the exact failure this
          # whole change exists to stop.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret. Falling back to debug signing."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/safarsathi.jks"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/safarsathi.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Build release APK
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        # EVERY BUILD GETS ITS OWN NUMBER. It was 0.1.0+1 for every build
        # ever made, so Settings → Apps → SafarSathi could not say which one
        # was on the phone — and "which build is installed?" is the first
        # question when an install is refused. The run number only rises, so
        # each build is an upgrade of the last.
        run: |
          flutter build apk --release \
            --build-name="0.1.${{ github.run_number }}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=MAPTILER_KEY="$MAPTILER_KEY"

      - name: Report whether maps are enabled in this build
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          if [ -n "$MAPTILER_KEY" ]; then
            echo "Maps ENABLED — a MapTiler key was supplied."
          else
            echo "Maps DISABLED — no MAPTILER_KEY secret is set."
            echo "The app will run and say so on its map screens."
          fi

      - name: Report how this build was signed
        run: |
          if [ -f android/key.properties ]; then
            echo "Signed with the RELEASE key. This installs over the"
            echo "previous build and keeps everything already in the app."
            # WHICH release key. "A key was present" is not "the same key as
            # last time": a replaced keystore secret passes every check above
            # and surfaces only as "package conflicts" on the phone. This is
            # the certificate actually inside the APK, read back by the SDK's
            # own verifier. The 18 Sep 2026 key is CAF8E289…A058A04F43.
            APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
            "$APKSIGNER" verify --print-certs \
              build/app/outputs/flutter-apk/app-release.apk \
              | grep -E "certificate (DN|SHA-256)"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so this APK is"
            echo "::warning::signed with throwaway debug keys. Installing it"
            echo "::warning::requires uninstalling the current app first,"
            echo "::warning::which WIPES the database. See RUNNING.md."
          fi

      - name: Size
        run: ls -lh build/app/outputs/flutter-apk/

      - uses: actions/upload-artifact@v4
        with:
          name: safarsathi-apk
          path: safarsathi/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # A ONE-TAP DOWNLOAD, because the artifact above is not one.
      #
      # An Actions artifact requires signing in, finding the run, downloading a
      # zip and extracting it — all of that on a phone, which is where the APK
      # actually has to end up. A release asset is a single link straight to
      # the .apk, and `latest-apk` always points at the newest build, so the
      # link never changes.
      #
      # The release is deleted and recreated rather than updated: a rolling tag
      # that still carries last week's asset is worse than no link at all.
      - name: Publish it as a one-tap download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk safarsathi.apk

          if [ -f android/key.properties ]; then
            SIGNED="Signed with the release key — installs over the previous build and keeps your data."
          else
            SIGNED="⚠️ Signed with throwaway debug keys. Installing needs the current app uninstalled first, which WIPES the database — save a backup first (More → Backup and restore)."
          fi
          if [ -n "${{ secrets.MAPTILER_KEY }}" ]; then
            MAPS="Maps enabled."
          else
            MAPS="Maps off — no MAPTILER_KEY secret. Paste a key into Settings → Map key on the phone to switch them on."
          fi

          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk safarsathi.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "SafarSathi — latest build" \
            --notes "$(printf '%s\n\n%s\n\n%s\n\nVersion 0.1.%s — after installing, Settings → Apps → SafarSathi should show this number.\n\nBuilt from `%s`.' \
              "$(git log -1 --pretty=%s)" "$SIGNED" "$MAPS" "${{ github.run_number }}" "${GITHUB_SHA:0:7}")"

          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/latest-apk/safarsathi.apk"
