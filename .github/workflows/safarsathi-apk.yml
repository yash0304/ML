# Builds an installable SafarSathi APK.
#
# The build container this project is developed in cannot reach
# dl.google.com, so it has no Android SDK and cannot produce an APK. GitHub's
# runners already have one, which makes this the shortest path from a commit
# to something you can put on a phone.
#
# The APK is signed with Android's debug keys — the Flutter template's default
# — so it installs on any phone that allows unknown sources. It is a test
# build, not a release.

name: SafarSathi APK

on:
  push:
    branches:
      - claude/offline-retro-modern-app-design-r2n4ju
    paths:
      - 'safarsathi/**'
      - '.github/workflows/safarsathi-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safarsathi

    steps:
      - uses: actions/checkout@v4

      # AGP 9 and Gradle 9 want a recent JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Toolchain
        run: flutter doctor -v

      - run: flutter pub get

      # The same gates the project holds itself to. A build that ships a
      # broken diary is worse than no build.
      - run: flutter analyze
      - run: flutter test

      # THE KEY COMES FROM A SECRET, NEVER FROM A TRACKED FILE.
      #
      # Set MAPTILER_KEY under Settings → Secrets and variables → Actions.
      # Without it the build still succeeds: the map disables itself and says
      # so on screen, which is the designed behaviour rather than a failure.
      #
      # `--dart-define` bakes the value into the binary, as every mobile map
      # SDK does. That is not a secret from whoever holds the APK; what it
      # avoids is the key living in git history forever. Restricting the key
      # to this app's package name in the MapTiler dashboard is the control
      # that actually matters.
      - name: Build release APK
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: flutter build apk --release --dart-define=MAPTILER_KEY="$MAPTILER_KEY"

      - name: Report whether maps are enabled in this build
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          if [ -n "$MAPTILER_KEY" ]; then
            echo "Maps ENABLED — a MapTiler key was supplied."
          else
            echo "Maps DISABLED — no MAPTILER_KEY secret is set."
            echo "The app will run and say so on its map screens."
          fi

      - name: Size
        run: ls -lh build/app/outputs/flutter-apk/

      - uses: actions/upload-artifact@v4
        with:
          name: safarsathi-apk
          path: safarsathi/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
