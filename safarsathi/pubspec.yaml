name: safarsathi
description: Offline-first travel companion for multi-stop road trips.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Persistence. SQLite is the only source of truth in this app; there is no
  # backend and no runtime network call.
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0
  path_provider: ^2.1.5

  # Platform intents: tel:, sms:, wa.me. No dialer permission needed.
  url_launcher: ^6.3.2

  # Sheet import — all pure Dart.
  file_picker: ^12.3.0
  csv: ^6.0.0
  excel: ^4.0.6

  # The ONLY network dependency, and it is used at trip setup on WiFi, never
  # at runtime. See DECISIONS.md: the app is offline while you are moving, not
  # offline absolutely, and every sync surface says what it is fetching.
  http: ^1.5.0

  # E.164 normalisation. Pure Dart, no platform channel, works offline.
  # The backlog originally named libphonenumber_plugin, which wraps the
  # native library over a channel — see DECISIONS.md.
  phone_numbers_parser: ^9.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift code generation lands at #2.
  drift_dev: ^2.35.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true

  assets:
    - assets/texture/

  # THREE FACES, THREE JOBS. See DESIGN_VISUAL_v2.md §3.
  #
  #   Jost          signage — a Futura revival, the geometric sans painted on
  #                 enamel road signs and posters through the 60s to 80s
  #   Archivo       words — a revival of mid-century newspaper grotesques
  #   Courier Prime numbers — a typewriter, because in a diary of numbers the
  #                 digits are the record, and a typewriter is what typed them
  #
  # Jost and Archivo are variable, so weights are selected through
  # FontVariation on the 'wght' axis. Courier Prime is static and ships two
  # weights, so plain fontWeight picks between them.
  #
  # The family names here MUST match the strings in app_tokens.dart. A
  # mismatch falls back to the system font silently, which is the easiest way
  # to build something that runs and looks wrong.
  fonts:
    - family: Jost
      fonts:
        - asset: assets/fonts/Jost.ttf
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo.ttf
    - family: CourierPrime
      fonts:
        - asset: assets/fonts/CourierPrime-Regular.ttf
          weight: 400
        - asset: assets/fonts/CourierPrime-Bold.ttf
          weight: 700
